name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: 构建并发布 Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node test.mjs
      - run: node pack.mjs
      - name: 生成 SHA256SUMS
        working-directory: dist
        run: sha256sum dsh-windows-notify-*.tgz dsh-windows-notify-plugin-*.zip > SHA256SUMS.txt
      - name: 创建 GitHub Release(资产 + 校验和)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > /tmp/release-notes.md <<'EOF'
          ## 安装

          - 方式一(源码接线,无需 pnpm):下载 `dsh-windows-notify-plugin-<version>.zip` 解压后运行 `.\install.ps1`,重启 DSH;
          - 方式二(pnpm 用户):`dsh plugin --profile web add dsh-windows-notify`。

          详见 [README](https://github.com/Sutera-Diffusus/dsh-windows-notify#readme) 与 [CHANGELOG](CHANGELOG.md)。
          资产完整性:见 SHA256SUMS.txt。
          EOF
          gh release create "${{ github.ref_name }}" \
            dist/dsh-windows-notify-*.tgz \
            dist/dsh-windows-notify-plugin-*.zip \
            dist/SHA256SUMS.txt \
            --title "dsh-windows-notify ${{ github.ref_name }}" \
            --notes-file /tmp/release-notes.md
